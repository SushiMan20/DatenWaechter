[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datenwaechter"
version = "1.4.1"
description = "Lokaler Scanner, der persönliche und geheime Daten vor dem Hochladen in KI-Chats erkennt und anonymisiert."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["datenschutz", "dsgvo", "anonymisieren", "pii", "ki", "chatgpt", "claude", "ocr", "schwärzen"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: German",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "pypdf>=4.0",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "pillow>=10",
]

[project.optional-dependencies]
# Texterkennung in Bildern und Scans: Windows-eigene OCR (nichts weiter zu installieren) …
windows = [
    "pywin32>=306; sys_platform == 'win32'",
    "keyring>=24",  # Token des KI-Servers in der Windows-Anmeldeinformationsverwaltung
    "tkinterdnd2>=0.4",
    "pystray>=0.19",  # Symbol im Infobereich
    "comtypes>=1.4; sys_platform == 'win32'",  # UI Automation: Doppelklick im Dateidialog von KI-Apps erkennen
    "winrt-runtime; sys_platform == 'win32'",
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
    "winrt-Windows.Globalization; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
]
# … oder Tesseract (Programm separat installieren, mit deutschem Sprachpaket)
tesseract = ["pytesseract>=0.3.10"]
# Gesichter auf Fotos finden und verpixeln (OpenCV 5 liefert die nötigen Modelle nicht mehr mit)
gesichter = ["opencv-python-headless>=4.8,<5", "numpy"]
# Lokales KI-Modell für Namen und Orte (das Modell selbst, ~180 MB, lädt man in den Einstellungen)
ki = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy"]
alles = ["datenwaechter[windows,tesseract,gesichter,ki]"]
dev = ["pytest>=8", "reportlab", "pytesseract>=0.3.10", "opencv-python-headless>=4.8,<5", "numpy"]
# Fertiges Windows-Programm bauen (siehe packaging/)
build = ["pyinstaller>=6.10"]

[project.urls]
Quellcode = "https://github.com/SushiMan20/DatenWaechter"
Fehler = "https://github.com/SushiMan20/DatenWaechter/issues"

[project.scripts]
datenwaechter = "datenwaechter.cli:main"

[project.gui-scripts]
datenwaechter-gui = "datenwaechter.gui:main"

[tool.setuptools]
packages = ["datenwaechter"]

[tool.setuptools.package-data]
datenwaechter = ["kategorien.json", "vornamen.txt"]
